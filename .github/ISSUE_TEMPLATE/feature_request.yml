name: Feature request
description: Propose an in-scope improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should the project solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundaries
      options:
        - label: This does not automate quota-based account rotation or circumvent rate limits.
          required: true
        - label: This does not require reading or transferring authentication tokens.
          required: true
