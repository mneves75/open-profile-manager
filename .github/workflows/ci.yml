name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and lint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Identify Swift toolchain
        id: swift-toolchain
        run: echo "version=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Install lint tools
        run: brew install ast-grep shellcheck

      - name: Resolve dependencies
        run: |
          swift package resolve
          npm ci --prefix video

      - name: Run quality gates
        run: Scripts/check.sh

      - name: Package ad-hoc signed app
        run: Scripts/package_app.sh release

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 "build/Open Profile Manager.app"

  intel-test:
    name: Intel x86_64 build and test
    # GitHub's last x86_64 macOS image; the shipped app is universal, so its Intel slice must run natively.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native Intel toolchain
        run: |
          test "$(uname -m)" = x86_64
          test -d "$DEVELOPER_DIR"
          swift --version

      - name: Build and test natively
        timeout-minutes: 15
        run: |
          swift build
          # Every test uses Swift Testing; on this image SwiftPM's trailing XCTest phase never exits.
          swift test --disable-xctest
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test --disable-xctest --filter statusReadsDoNotOccupyCooperativePool
          Scripts/test_interactive_launch.sh

      - name: Package and run the Intel app slice
        timeout-minutes: 10
        run: |
          Scripts/package_app.sh release
          test "$(lipo -archs "build/Open Profile Manager.app/Contents/MacOS/OpenProfileManager")" = x86_64
          Scripts/test_packaged_app.sh "build/Open Profile Manager.app"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  sbom:
    name: Generate SBOM
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: open-profile-manager.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-profile-manager-sbom
          path: open-profile-manager.spdx.json
          if-no-files-found: error
          retention-days: 30
